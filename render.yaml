# render.yaml — Render Blueprint (IaC) for WebMCP Auto
# ─────────────────────────────────────────────────────────────────
# ⚠️ EN 사일로 단독 배포 버전 (ko 사일로 제외)
#    - ko/en 전체 배포용은 render-full-silo.yaml 참고
#
# 사용법:
#   1) Render Dashboard → New → Blueprint → 이 저장소 선택
#   2) 생성 프롬프트에서 GEMINI_API_KEY / OPENROUTER_API_KEY 값 입력
#   3) DJANGO_SECRET_KEY는 generateValue로 자동 생성
#
# 포트: Render는 $PORT(=10000) 자동 주입 — gunicorn은 docker-entrypoint.sh에서
#       0.0.0.0:$PORT 로 바인딩. 프론트 프록시 대상은 http://webmcp-web-en:10000
# ─────────────────────────────────────────────────────────────────

services:
  - type: web                    # Django 웹 (en)
    name: webmcp-web-en
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    healthCheckPath: /api/health/
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    envVars:
      - fromGroup: webmcp-common
      - fromGroup: webmcp-secrets
      - fromGroup: webmcp-en
      - key: DATABASE_URL
        fromDatabase:
          name: webmcp-db-en
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web                    # Nuxt 프론트엔드 (en)
    name: webmcp-front-en
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    healthCheckPath: /
    dockerfilePath: ./docker/Dockerfile.frontend
    dockerContext: .
    envVars:
      - key: NUXT_PUBLIC_SILO_LANG
        value: en
      # 빌드 타임 고정 — Nuxt routeRules 프록시 대상 (Render 내부 네트워크, 포트 10000)
      - key: API_HOST
        value: http://webmcp-web-en:10000
      - key: NUXT_API_PROXY_TARGET
        value: http://webmcp-web-en:10000

  - type: worker
    name: webmcp-worker-en
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    dockerContext: .
    dockerfilePath: ./docker/Dockerfile.backend
    # ⚠️ 체인 커맨드("a && b")는 Render가 파일명으로 오판해 크래시 루프(실측) —
    # 반드시 스크립트 파일로 실행할 것
    dockerCommand: ./docker-worker-entrypoint.sh
    envVars:
      - fromGroup: webmcp-common
      - fromGroup: webmcp-secrets
      - fromGroup: webmcp-en
      - key: DATABASE_URL
        fromDatabase:
          name: webmcp-db-en
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

envVarGroups:
  - name: webmcp-common
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECURE_COOKIES
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_RETENTION_DAYS
        value: "28"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"
      - key: TERSER_CMD
        value: terser
      - key: ALLOWED_HOSTS
        value: "*"
      # ⚠️ envVarGroups 안에서는 sync: false 불가(Render가 무시) —
      # API 키는 각 서비스 envVars에 sync: false로 직접 정의함

  - name: webmcp-secrets
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

  - name: webmcp-en
    envVars:
      - key: WEBMCP_LANG
        value: en
      - key: WEBMCP_LANGS
        value: en
      - key: SAAS_PUBLIC_URL
        value: "https://webmcp-front-en.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://webmcp-front-en.onrender.com"

databases:
  - name: webmcp-db-en
    databaseName: webmcp_en
    user: webmcp_en_user
    region: oregon
    plan: 0.5c-1g
    ipAllowList: []
