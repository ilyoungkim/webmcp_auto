worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10m;

    # ── 한국어(ko) 사일로 전용 nginx ────────────────────────────
    # 서비스명이 backend-ko / frontend-ko 인 컨테이너로 프록시한다.
    # Docker DNS(127.0.0.11)를 resolver로 쓰고 proxy_pass에 변수를 써서
    # 컨테이너 재시작으로 IP가 바뀌어도 nginx 재시작 없이 자동 갱신한다.
    # (정적 upstream은 시작 시 1회만 resolve → 구 IP로 접속해 502 발생 사례 있음)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # 긴 채팅 응답 허용
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        # 데이터 플레인 / 콘솔 API → Django
        location ~ ^/(api|django-admin|embed|preview|widget-dist|health|ready)(/|$) {
            set $backend_upstream http://backend-ko:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
        }

        # 그 외 (콘솔 페이지, 자산) → Nuxt
        location / {
            set $frontend_upstream http://frontend-ko:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}