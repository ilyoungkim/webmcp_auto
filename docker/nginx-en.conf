worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10m;

    # ── 영어(en) 사일로 전용 nginx ──────────────────────────────
    # 서비스명이 backend-en / frontend-en 인 컨테이너로 프록시한다.
    upstream backend { server backend-en:8000; }
    upstream frontend { server frontend-en:3000; }

    server {
        listen 80;
        server_name _;

        # 긴 채팅 응답 허용
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        # 데이터 플레인 / 콘솔 API → Django
        location ~ ^/(api|django-admin|embed|preview|widget-dist|health|ready)(/|$) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
        }

        # 그 외 (콘솔 페이지, 자산) → Nuxt
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
