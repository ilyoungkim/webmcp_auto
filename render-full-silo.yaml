services:
  - type: web
    name: webmcp-web-ko
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    healthCheckPath: /api/health/
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    envVars:
      - fromGroup: webmcp-common
      - fromGroup: webmcp-secrets
      - fromGroup: webmcp-ko
      - key: DATABASE_URL
        fromDatabase:
          name: webmcp-db-ko
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: webmcp-web-en
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    healthCheckPath: /api/health/
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    envVars:
      - fromGroup: webmcp-common
      - fromGroup: webmcp-secrets
      - fromGroup: webmcp-en
      - key: DATABASE_URL
        fromDatabase:
          name: webmcp-db-en
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: webmcp-front-ko
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    healthCheckPath: /
    dockerfilePath: ./docker/Dockerfile.frontend
    dockerContext: .
    envVars:
      - key: NUXT_PUBLIC_SILO_LANG
        value: ko
      # 빌드 타임 고정 — Nuxt routeRules 프록시 대상 (Render 내부 네트워크, 포트 10000)
      - key: API_HOST
        value: http://webmcp-web-ko:10000
      - key: NUXT_API_PROXY_TARGET
        value: http://webmcp-web-ko:10000

  - type: worker
    name: webmcp-worker-ko
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    dockerCommand: |
      ./docker-worker-entrypoint.sh
    envVars:
      - fromGroup: webmcp-common
      - fromGroup: webmcp-secrets
      - fromGroup: webmcp-ko
      - key: DATABASE_URL
        fromDatabase:
          name: webmcp-db-ko
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: webmcp-front-en
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    healthCheckPath: /
    dockerfilePath: ./docker/Dockerfile.frontend
    dockerContext: .
    envVars:
      - key: NUXT_PUBLIC_SILO_LANG
        value: en
      # 빌드 타임 고정 — Nuxt routeRules 프록시 대상 (Render 내부 네트워크, 포트 10000)
      - key: API_HOST
        value: http://webmcp-web-en:10000
      - key: NUXT_API_PROXY_TARGET
        value: http://webmcp-web-en:10000

  - type: worker
    name: webmcp-worker-en
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    dockerContext: .
    dockerfilePath: ./docker/Dockerfile.backend
    dockerCommand: |
      ./docker-worker-entrypoint.sh
    envVars:
      - fromGroup: webmcp-common
      - fromGroup: webmcp-secrets
      - fromGroup: webmcp-en
      - key: DATABASE_URL
        fromDatabase:
          name: webmcp-db-en
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

envVarGroups:
  - name: webmcp-common
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECURE_COOKIES
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_RETENTION_DAYS
        value: "28"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"
      - key: TERSER_CMD
        value: terser
      - key: ALLOWED_HOSTS
        value: "*"
      # ⚠️ envVarGroups 안에서는 sync: false 불가(Render가 무시) —
      # API 키는 각 서비스 envVars에 sync: false로 직접 정의함

  - name: webmcp-secrets
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

  - name: webmcp-ko
    envVars:
      - key: WEBMCP_LANG
        value: ko
      - key: WEBMCP_LANGS
        value: ko
      - key: SAAS_PUBLIC_URL
        value: "https://webmcp-front-ko.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://webmcp-front-ko.onrender.com"

  - name: webmcp-en
    envVars:
      - key: WEBMCP_LANG
        value: en
      - key: WEBMCP_LANGS
        value: en
      - key: SAAS_PUBLIC_URL
        value: "https://webmcp-front-en.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://webmcp-front-en.onrender.com"

databases:
  - name: webmcp-db-ko
    databaseName: webmcp_ko
    user: webmcp_ko_user
    region: oregon
    plan: 0.5c-1g
    ipAllowList: []

  - name: webmcp-db-en
    databaseName: webmcp_en
    user: webmcp_en_user
    region: oregon
    plan: 0.5c-1g
    ipAllowList: []
