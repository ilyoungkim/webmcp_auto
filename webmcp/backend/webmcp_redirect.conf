# ============================================================================
# webmcp_redirect.conf — 3단계: HTTP → HTTPS 리다이렉트 (인증서 발급 후)
# ============================================================================
# 인증서 발급 완료 후, HTTP(80) 블록을 이 리다이렉트 블록으로 교체합니다.
# (ACME 챌린지 경로는 유지해서 갱신도 정상 동작)
# ============================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  webmcp.duckdns.org;

    # Let's Encrypt 갱신용 HTTP-01 챌린지 경로 유지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 요청은 HTTPS 로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}
