# ============================================================================
# webmcp_https.conf — webmcp.duckdns.org HTTPS 서버 블록 (인증서 발급 후 배치)
# ============================================================================
# ⚠️ 이 파일은 인증서 발급 완료 후에만 배치해야 합니다.
#    (인증서 파일이 없으면 nginx -t 가 실패합니다)
# ============================================================================

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  webmcp.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/webmcp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmcp.duckdns.org/privkey.pem;

    # 보안 강화 (A 등급)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 공용 프론트 (데모/위젯)
    root  /usr/share/nginx/webmcp;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 백엔드 FastAPI 프록시 (Gemini 키는 백엔드 DB에서 관리)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # 백엔드 헬스체크
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
