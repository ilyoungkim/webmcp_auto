# ============================================================================
# webmcp_http.conf — 1단계: HTTP(80) 블록 (인증서 발급 전)
# ============================================================================
# ACME HTTP-01 챌린지 응답 + HTTPS 리다이렉트용.
# 인증서 발급 전에 먼저 배치합니다.
# ============================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  webmcp.duckdns.org;

    # Let's Encrypt HTTP-01 챌린지 응답용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 요청은 일단 404 (인증서 발급 전)
    location / {
        return 404;
    }
}
