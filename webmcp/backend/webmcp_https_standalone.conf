# ============================================================================
# webmcp_https_standalone.conf — webmcp.duckdns.org HTTPS(443) standalone nginx
# ============================================================================
# 8081 standalone 과 분리된 별도 nginx로 443 포트에서 HTTPS 를 서빙합니다.
# (기존 80포트 haproxy, 8081 standalone 과 충돌 없음)
#
# 실행:
#   sudo nginx -c /etc/nginx/webmcp_https_standalone.conf
#   sudo nginx -s reload -c /etc/nginx/webmcp_https_standalone.conf
#   sudo nginx -s stop   -c /etc/nginx/webmcp_https_standalone.conf
# ============================================================================

# 독립 실행이라 기본 nginx(80) 와 분리된 pid/로그를 사용
pid /run/nginx-webmcp-https.pid;
error_log /var/log/nginx/webmcp_https_error.log;
worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/webmcp_https_access.log;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  webmcp.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/webmcp.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/webmcp.duckdns.org/privkey.pem;

        # 보안 강화
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # WebMCP 표준 API 오리진 격리 (필수)
        add_header Origin-Agent-Cluster "?1" always;
        add_header Permissions-Policy "tools=(self)" always;

        # 공용 프론트 (데모/위젯)
        root /usr/share/nginx/webmcp;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # 백엔드 FastAPI 프록시 (Gemini 키는 백엔드 DB에서 관리)
        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # /api/chat CORS 사전 요청(OPTIONS) 허용
        location = /api/chat {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Access-Control-Max-Age 3600 always;
                return 204;
            }
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # 백엔드 헬스체크
        location = /health {
            proxy_pass http://127.0.0.1:8001/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
