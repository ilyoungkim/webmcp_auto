# ============================================================================
# webmcp_standalone.conf — webmcp 전용 standalone nginx (8081 포트)
# ============================================================================
# 기존 /etc/nginx/nginx.conf 는 절대 수정하지 않습니다.
# 이 파일을 별도로 두고 nginx -c 로 실행해, 8081 포트에서 webmcp만 서빙합니다.
#
# 실행:
#   sudo nginx -c /etc/nginx/webmcp_standalone.conf
#   sudo nginx -s reload -c /etc/nginx/webmcp_standalone.conf
#   sudo nginx -s stop   -c /etc/nginx/webmcp_standalone.conf
#
# 접속:
#   http://<서버IP>:8081/            → 데모 페이지 (프론트)
#   http://<서버IP>:8081/api/chat    → Gemini 프록시 (백엔드 8001)
# ============================================================================

# 독립 실행이라 기본 nginx(80) 와 분리된 pid/로그를 사용
pid /run/nginx-webmcp.pid;
error_log /var/log/nginx/webmcp_error.log;
worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/webmcp_access.log;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen       8081;
        listen       [::]:8081;
        server_name  _;

        # 공용 프론트 (데모/위젯)
        root /usr/share/nginx/webmcp;
        index index.html;

        # WebMCP 표준 API 오리진 격리 (필수)
        add_header Origin-Agent-Cluster "?1" always;
        add_header Permissions-Policy "tools=(self)" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # 백엔드 FastAPI 프록시 (Gemini 키는 백엔드 DB에서 관리)
        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # 백엔드 헬스체크 (연결 상태 배지용)
        location = /health {
            proxy_pass http://127.0.0.1:8001/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # /api/chat CORS 사전 요청(OPTIONS) 허용
        location = /api/chat {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Access-Control-Max-Age 3600 always;
                return 204;
            }
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }
    }
}
