# ============================================================================
# webmcp/backend/webmcp_nginx.conf
# ============================================================================
# 🚫 기존 nginx 설정은 절대 수정하지 않습니다.
# 이 파일은 별도 파일로 /etc/nginx/conf.d/ 에 추가해
# "8081 포트 전용 webmcp 서버 블록" 을 새로 띄웁니다.
#
# 설치 방법:
#   sudo cp webmcp_nginx.conf /etc/nginx/conf.d/webmcp_8081.conf
#   sudo nginx -t && sudo nginx -s reload
#
# 접속:
#   http://<서버IP>:8081/            → 데모 페이지 (프론트)
#   http://<서버IP>:8081/api/chat    → Gemini 프록시 (백엔드 8001)
# ============================================================================

server {
    listen       8081;
    listen       [::]:8081;
    server_name  _;

    # 공용 프론트 (데모/위젯)
    root /usr/share/nginx/webmcp;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 백엔드 FastAPI 프록시 (Gemini 키는 백엔드 DB에서 관리)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # /api/chat CORS 사전 요청(OPTIONS) 허용
    location = /api/chat {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 3600 always;
            return 204;
        }
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
